[project]
name = "trafficbench"
version = "0.1.0"
description = "METR-LA forecasting baselines and sensor-graph routing simulation"
requires-python = ">=3.12,<3.14"
dependencies = [
  "torch==2.14.1",
  "numpy>=2.1,<3",
  "pandas>=2.2,<3",
  "h5py>=3.12,<4",
  "networkx>=3.4,<4",
  "ncps==1.0.1",
]

[project.scripts]
trafficbench = "trafficbench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
