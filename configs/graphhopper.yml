graphhopper:
  datareader.file: data/monaco.osm.gz
  graph.location: .runtime/graph-cache-monaco
  graph.encoded_values: car_access, car_average_speed, road_access, road_class, max_speed, osm_way_id
  profiles:
    - name: car
      turn_costs:
        vehicle_types: [motorcar, motor_vehicle]
        u_turn_costs: 60
      custom_model_files: [car.json]
  profiles_ch:
    - profile: car
  profiles_lm: []
  prepare.min_network_size: 200
  import.osm.ignored_highways: footway, construction, cycleway, path, steps
  graph.dataaccess.default_type: RAM_STORE

server:
  application_connectors:
    - type: http
      port: 8989
      bind_host: 127.0.0.1
  admin_connectors:
    - type: http
      port: 8990
      bind_host: 127.0.0.1
  request_log:
    appenders: []

logging:
  level: INFO
  appenders:
    - type: console
